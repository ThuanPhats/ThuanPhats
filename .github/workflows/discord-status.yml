name: Update Discord Status

on:
  schedule:
    - cron: "*/10 * * * *"   # cập nhật mỗi 10 phút (UTC)
  workflow_dispatch:         # có thể chạy tay

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

env:
  DISCORD_ID: "928478301943640114"
  TZ: "Asia/Ho_Chi_Minh"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch presence from Lanyard
        run: |
          set -e
          CODE=$(curl -sS -w "%{http_code}" -o lanyard.json "https://api.lanyard.rest/v1/users/${DISCORD_ID}")
          echo "HTTP=$CODE"
          cat lanyard.json || true

      - name: Build + inject into README (Python, safe)
        run: |
          python3 - << 'PY'
          import json, os, re, sys
          from datetime import datetime

          # 1) Đọc JSON Lanyard
          try:
              data = json.load(open('lanyard.json', 'r', encoding='utf-8'))
          except Exception:
              data = {"success": False}

          # 2) Tạo câu status thân thiện
          def build_out(d):
              if not d.get('success'):
                  return "⚫ Offline • Lanyard chưa có dữ liệu (hãy join https://discord.gg/lanyard và bật Share your activity status)"
              info = d.get('data', {})
              status = info.get('discord_status', 'offline')
              base = {'online':'🟢 Online','idle':'🌙 Idle','dnd':'⛔ DND','offline':'⚫ Offline'}.get(status,'⚪ Unknown')

              if info.get('listening_to_spotify'):
                  sp = info.get('spotify', {})
                  song = sp.get('song'); artist = sp.get('artist')
                  if song and artist:
                      return f"🎧 Đang nghe: {song} — {artist}"
                  return base

              acts = info.get('activities') or []
              game = next((a.get('name') for a in acts if a.get('type')==0 and a.get('name')), None)
              custom = next((a.get('state') for a in acts if a.get('type')==4 and a.get('state')), None)
              if game:
                  return f"{base} • 🎮 {game}"
              if custom:
                  return f"{base} • {custom}"
              return base

          out = build_out(data)
          out += " • cập nhật: " + datetime.now().strftime('%H:%M %d/%m')

          # 3) Chèn vào giữa markers
          path = 'README.md'
          start = '<!-- DISCORD_STATUS_START -->'
          end   = '<!-- DISCORD_STATUS_END -->'
          with open(path, 'r', encoding='utf-8') as f:
              s = f.read()
          if start not in s or end not in s:
              print('Markers not found in README.md', file=sys.stderr)
              sys.exit(1)

          pattern = re.compile(re.escape(start) + r'.*?' + re.escape(end), re.S)
          ns = pattern.sub(start + '\n' + out + '\n' + end, s, count=1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(ns)

          print("Injected:", out)
          PY

      - name: Commit changes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update Discord status"
          git push
